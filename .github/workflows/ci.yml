name: CI

# Feature-branch commits are covered by the local pre-commit gitleaks hook and
# by the PR run; main is re-scanned after every merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          dir="$(mktemp -d)"
          curl -fsSL -o "${dir}/${tarball}" "${base}/${tarball}"
          curl -fsSL -o "${dir}/${checksums}" "${base}/${checksums}"
          (cd "${dir}" && grep " ${tarball}\$" "${checksums}" | sha256sum --check --strict -)
          tar -xzf "${dir}/${tarball}" -C "${dir}" gitleaks
          sudo install -m 0755 "${dir}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git --redact --verbose .
